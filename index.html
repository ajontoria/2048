<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    padding: 20px 12px 40px;
    touch-action: none;
    user-select: none;
  }
  .wrap { width: 100%; max-width: 460px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    font-size: 42px;
    font-weight: 700;
    margin: 0;
    color: var(--text-dark);
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board-bg);
    color: var(--text-light);
    border-radius: 6px;
    padding: 8px 16px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .score-box .value { font-size: 20px; font-weight: 700; }
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .subtext { font-size: 14px; color: var(--text-dark); max-width: 260px; line-height: 1.4; }
  button.action {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.action:hover { background: #9f8b76; }
  button.action:active { transform: scale(0.97); }
  button.action:disabled { opacity: 0.5; cursor: default; }
  #undo-btn { background: #b0a190; margin-right: 8px; }
  #undo-btn:hover { background: #bfae9d; }
  .btn-row { display: flex; }

  .board-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border-radius: 10px;
    padding: 12px;
  }
  .grid-bg {
    position: absolute;
    inset: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 4%;
  }
  .grid-cell {
    background: var(--cell-bg);
    border-radius: 6px;
  }
  .tiles-layer {
    position: absolute;
    inset: 12px;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 700;
    transition: top 0.12s ease-in-out, left 0.12s ease-in-out;
    will-change: top, left;
  }
  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transform: scale(1);
  }
  .tile.new .tile-inner { animation: appear 0.18s ease; }
  .tile.merged .tile-inner { animation: pop 0.16s ease; }
  @keyframes appear {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .t2 { background: #eee4da; color: #776e65; }
  .t4 { background: #ede0c8; color: #776e65; }
  .t8 { background: #f2b179; color: #f9f6f2; }
  .t16 { background: #f59563; color: #f9f6f2; }
  .t32 { background: #f67c5f; color: #f9f6f2; }
  .t64 { background: #f65e3b; color: #f9f6f2; }
  .t128 { background: #edcf72; color: #f9f6f2; }
  .t256 { background: #edcc61; color: #f9f6f2; }
  .t512 { background: #edc850; color: #f9f6f2; }
  .t1024 { background: #edc53f; color: #f9f6f2; }
  .t2048 { background: #edc22e; color: #f9f6f2; }
  .t-big { background: #3c3a32; color: #f9f6f2; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .overlay h2 { font-size: 34px; margin: 0 0 16px; color: var(--text-dark); }
  .overlay button {
    margin-top: 6px;
  }

  .arrows {
    display: none;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 50px 50px;
    gap: 6px;
    justify-content: center;
    margin-top: 20px;
  }
  .arrows button {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
  }
  .arrows button:active { transform: scale(0.94); }
  #a-up { grid-column: 2; grid-row: 1; }
  #a-left { grid-column: 1; grid-row: 2; }
  #a-down { grid-column: 2; grid-row: 2; }
  #a-right { grid-column: 3; grid-row: 2; }

  @media (hover: none) and (pointer: coarse) {
    .arrows { display: grid; }
  }

  footer {
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dark);
    opacity: 0.75;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="controls-row">
    <div class="subtext">Join the tiles, get to <strong>2048</strong>! Use arrow keys or swipe.</div>
    <div class="btn-row">
      <button class="action" id="undo-btn" disabled>Undo</button>
      <button class="action" id="new-game-btn">New Game</button>
    </div>
  </div>

  <div class="board-container" id="board-container">
    <div class="grid-bg" id="grid-bg"></div>
    <div class="tiles-layer" id="tiles-layer"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-text">Game Over</h2>
      <button class="action" id="overlay-btn">Try Again</button>
    </div>
  </div>

  <div class="arrows">
    <button id="a-up">&#8593;</button>
    <button id="a-left">&#8592;</button>
    <button id="a-down">&#8595;</button>
    <button id="a-right">&#8594;</button>
  </div>

  <footer>Swipe or use arrow keys to play. One-step undo available.</footer>
</div>

<script>
(function () {
  const SIZE = 4;
  const boardContainer = document.getElementById('board-container');
  const gridBg = document.getElementById('grid-bg');
  const tilesLayer = document.getElementById('tiles-layer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlay-text');
  const overlayBtn = document.getElementById('overlay-btn');
  const newGameBtn = document.getElementById('new-game-btn');
  const undoBtn = document.getElementById('undo-btn');

  let grid = [];
  let score = 0;
  let best = 0; // in-memory only (no persistent storage in this environment)
  let tileIdCounter = 1;
  let wonAnnounced = false;
  let gameOver = false;
  let history = null; // one-level undo snapshot

  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');
    c.className = 'grid-cell';
    gridBg.appendChild(c);
  }

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < SIZE; r++) {
      g.push(new Array(SIZE).fill(null));
    }
    return g;
  }

  function cloneGrid(g) {
    return g.map(row => row.map(cell => cell ? { id: cell.id, value: cell.value } : null));
  }

  function randomEmptyCell() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function spawnTile() {
    const pos = randomEmptyCell();
    if (!pos) return;
    const [r, c] = pos;
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[r][c] = { id: tileIdCounter++, value: value, isNew: true, merged: false };
  }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    wonAnnounced = false;
    gameOver = false;
    history = null;
    undoBtn.disabled = true;
    overlay.classList.remove('show');
    spawnTile();
    spawnTile();
    updateScore();
    render();
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
    }
    bestEl.textContent = best;
  }

  function tileClass(value) {
    if (value <= 2048) return 't' + value;
    return 't-big';
  }

  function render() {
    tilesLayer.innerHTML = '';
    const cellPct = 100 / SIZE;
    const gapPct = 4; // matches grid gap approx via percentage offset trick
    // We'll position using simple percentage of container minus gap compensation
    const gapPx = 0; // gap handled visually by inset sizing below
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = grid[r][c];
        if (!cell) continue;
        const tile = document.createElement('div');
        tile.className = 'tile' + (cell.isNew ? ' new' : '') + (cell.merged ? ' merged' : '');
        tile.dataset.id = cell.id;
        const size = (100 / SIZE);
        const gap = 3; // percent gap similar to grid
        const w = size - gap * (SIZE - 1) / SIZE;
        tile.style.width = w + '%';
        tile.style.height = w + '%';
        tile.style.top = (r * size + (r * gap / SIZE)) + '%';
        tile.style.left = (c * size + (c * gap / SIZE)) + '%';

        const inner = document.createElement('div');
        inner.className = 'tile-inner ' + tileClass(cell.value);
        const fontSize = cell.value >= 1000 ? '1.5rem' : cell.value >= 100 ? '1.9rem' : '2.3rem';
        inner.style.fontSize = fontSize;
        inner.textContent = cell.value;
        tile.appendChild(inner);
        tilesLayer.appendChild(tile);

        cell.isNew = false;
        cell.merged = false;
      }
    }
    updateScore();
  }

  function saveHistory() {
    history = {
      grid: cloneGrid(grid),
      score: score
    };
    undoBtn.disabled = false;
  }

  function doUndo() {
    if (!history || gameOver) return;
    grid = history.grid;
    score = history.score;
    history = null;
    undoBtn.disabled = true;
    render();
  }

  // Core move logic: operate on lines. direction: 'left','right','up','down'
  function getLine(r_or_c, dir) {
    const line = [];
    for (let i = 0; i < SIZE; i++) {
      if (dir === 'left' || dir === 'right') {
        line.push({ r: r_or_c, c: i });
      } else {
        line.push({ r: i, c: r_or_c });
      }
    }
    return line;
  }

  function move(dir) {
    if (gameOver) return;
    const prevGrid = cloneGrid(grid);
    let moved = false;
    let gained = 0;

    const lines = [];
    for (let i = 0; i < SIZE; i++) lines.push(getLine(i, dir));

    for (let line of lines) {
      let coords = line.map(p => ({ r: p.r, c: p.c }));
      if (dir === 'right' || dir === 'down') coords = coords.slice().reverse();

      let values = coords.map(p => grid[p.r][p.c]).filter(v => v !== null);

      const merged = [];
      let i = 0;
      while (i < values.length) {
        if (i + 1 < values.length && values[i].value === values[i + 1].value) {
          const newVal = values[i].value * 2;
          merged.push({ id: values[i].id, value: newVal, merged: true, isNew: false });
          gained += newVal;
          i += 2;
        } else {
          merged.push({ id: values[i].id, value: values[i].value, merged: false, isNew: false });
          i += 1;
        }
      }
      while (merged.length < SIZE) merged.push(null);

      for (let idx = 0; idx < SIZE; idx++) {
        const target = coords[idx];
        const newCellData = merged[idx];
        const oldCell = grid[target.r][target.c];
        const isDifferent = (!oldCell && newCellData) ||
          (oldCell && !newCellData) ||
          (oldCell && newCellData && (oldCell.id !== newCellData.id || oldCell.value !== newCellData.value));
        if (isDifferent) moved = true;
        grid[target.r][target.c] = newCellData ? { id: newCellData.id, value: newCellData.value, merged: newCellData.merged, isNew: false } : null;
      }
    }

    if (moved) {
      saveHistoryFrom(prevGrid, score);
      score += gained;
      spawnTile();
      render();
      checkWin();
      checkGameOver();
    }
  }

  function saveHistoryFrom(prevGrid, prevScore) {
    history = { grid: prevGrid, score: prevScore };
    undoBtn.disabled = false;
  }

  function checkWin() {
    if (wonAnnounced) return;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] && grid[r][c].value >= 2048) {
          wonAnnounced = true;
          showOverlay('You win!', 'Keep going');
          return;
        }
      }
    }
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        const v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    if (!hasMoves()) {
      gameOver = true;
      showOverlay('Game over', 'Try again');
    }
  }

  function showOverlay(text, btnText) {
    overlayText.textContent = text;
    overlayBtn.textContent = btnText;
    overlay.classList.add('show');
  }

  // Keyboard controls
  window.addEventListener('keydown', function (e) {
    let dir = null;
    if (e.key === 'ArrowLeft') dir = 'left';
    else if (e.key === 'ArrowRight') dir = 'right';
    else if (e.key === 'ArrowUp') dir = 'up';
    else if (e.key === 'ArrowDown') dir = 'down';
    if (dir) {
      e.preventDefault();
      if (overlay.classList.contains('show') && gameOver) return;
      move(dir);
    }
  });

  // Touch / swipe controls
  let touchStartX = 0, touchStartY = 0;
  boardContainer.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  boardContainer.addEventListener('touchend', function (e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 20;
    if (Math.max(absX, absY) < threshold) return;
    if (gameOver) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  // On-screen arrow buttons
  document.getElementById('a-up').addEventListener('click', () => move('up'));
  document.getElementById('a-down').addEventListener('click', () => move('down'));
  document.getElementById('a-left').addEventListener('click', () => move('left'));
  document.getElementById('a-right').addEventListener('click', () => move('right'));

  newGameBtn.addEventListener('click', newGame);
  overlayBtn.addEventListener('click', function () {
    if (overlayText.textContent === 'You win!') {
      overlay.classList.remove('show');
    } else {
      newGame();
    }
  });
  undoBtn.addEventListener('click', doUndo);

  newGame();
})();
</script>
</body>
</html>
